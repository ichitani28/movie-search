<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
  <meta name="description" content="登録9チャンネルの映画まとめ動画を、タイトルで検索できます。再生回数・いいね・新着などのランキングも掲載。">
  <title>映画まとめ動画検索</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4f0;
      --bg-elev: #ffffff;
      --text: #1a1916;
      --text-sub: #5c5850;
      --border: #e2ddd4;
      --accent: #0b6e4f;
      --accent-text: #ffffff;
      --danger: #a33b2a;
      --thumb-bg: #e8e4dc;
      --focus: #0b6e4f;
      --radius: 12px;
      --pad: 16px;
      --thumb-w: 120px;
      --thumb-h: 68px;
      --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      --gold: #e8c547;
      --gold-text: #3a2e00;
      --silver: #c5c8ce;
      --silver-text: #2a2c30;
      --bronze: #d4925a;
      --bronze-text: #3a220e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --bg-elev: #1c1c1c;
        --text: #f3f1ec;
        --text-sub: #b4afa6;
        --border: #2e2c28;
        --accent: #3dba8b;
        --accent-text: #08150f;
        --danger: #f0a090;
        --thumb-bg: #2a2824;
        --focus: #3dba8b;
        --gold: #f0d36a;
        --gold-text: #2a2200;
        --silver: #d0d3d8;
        --silver-text: #1c1e22;
        --bronze: #e0a370;
        --bronze-text: #2a1808;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    body {
      min-height: 100dvh;
      padding: 20px var(--pad) 48px;
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
    }
    .wrap {
      max-width: 40rem;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .lede {
      margin: 0 0 16px;
      color: var(--text-sub);
      font-size: 0.95rem;
    }
    .metrics {
      display: flex;
      gap: 8px;
      margin: 0 0 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .metric {
      flex: 1 1 0;
      min-width: 88px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .metric b {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .metric span {
      display: block;
      color: var(--text-sub);
      font-size: 0.75rem;
      margin-top: 2px;
    }
    .filters {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }
    .filters-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 560px) {
      .filters-row { grid-template-columns: 1fr 1fr; }
    }
    label.field {
      display: grid;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
    }
    input[type="search"],
    select {
      width: 100%;
      min-height: 48px;
      font: inherit;
      font-size: 16px;
      font-weight: 400;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      appearance: none;
    }
    select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%235c5850' d='M1 1l5 5 5-5'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
    }
    input[type="search"]:focus,
    select:focus,
    .toggle:focus-within,
    .rank-tabs button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }
    .toggle input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }
    .switch {
      flex: 0 0 auto;
      width: 52px;
      height: 32px;
      border-radius: 999px;
      background: var(--border);
      position: relative;
      transition: background 0.15s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--bg-elev);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      transition: transform 0.15s ease;
    }
    .toggle input:checked + .switch {
      background: var(--accent);
    }
    .toggle input:checked + .switch::after {
      transform: translateX(20px);
    }
    .status-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 8px;
    }
    .status-row h2 {
      margin: 0;
      font-size: 1.05rem;
    }
    .count {
      color: var(--text-sub);
      font-size: 0.85rem;
    }
    .msg {
      padding: 20px 4px;
      color: var(--text-sub);
    }
    .msg.error { color: var(--danger); }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .item {
      border-bottom: 1px solid var(--border);
    }
    .item a {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 0;
      min-height: 92px;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .item a:active {
      opacity: 0.75;
    }
    .thumb {
      width: var(--thumb-w);
      height: var(--thumb-h);
      flex: 0 0 var(--thumb-w);
      border-radius: 8px;
      background: var(--thumb-bg);
      object-fit: cover;
      display: block;
    }
    .thumb-fallback {
      width: var(--thumb-w);
      height: var(--thumb-h);
      flex: 0 0 var(--thumb-w);
      border-radius: 8px;
      background: var(--thumb-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-fallback[hidden], .thumb[hidden] { display: none !important; }
    .thumb-fallback svg { width: 28px; height: 28px; }
    html, body { overflow-x: hidden; }
    .title { overflow-wrap: anywhere; word-break: break-word; }
    .meta { min-width: 0; flex: 1; }
    .title {
      font-weight: 650;
      font-size: 0.95rem;
      line-height: 1.4;
      margin: 0 0 4px;
    }
    .sub {
      color: var(--text-sub);
      font-size: 0.8rem;
      margin: 0;
    }
    .stats-line {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 8px;
      color: var(--text-sub);
      font-size: 0.72rem;
      margin: 2px 0 0;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .more {
      width: 100%;
      min-height: 52px;
      margin-top: 16px;
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      padding: 12px 16px;
    }
    .more:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .more:active { opacity: 0.9; }
    footer {
      margin-top: 32px;
      color: var(--text-sub);
      font-size: 0.78rem;
      line-height: 1.6;
    }
    @media (max-width: 360px) {
      :root { --thumb-w: 108px; --thumb-h: 61px; --pad: 12px; }
      h1 { font-size: 1.2rem; }
    }

    /* 2-column card grid */
    .list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 10px; }
    @media (min-width: 700px) { .list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 1000px) { .list { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .item { border-bottom: 0; }
    .item a { display: block; padding: 0; min-height: 0; }
    .thumb, .thumb-fallback { width: 100%; height: auto; aspect-ratio: 16 / 9; flex: none; border-radius: 12px; }
    .item.is-short .thumb, .item.is-short .thumb-fallback { aspect-ratio: 9 / 16; }
    .meta { padding: 8px 2px 0; }
    .title { font-size: 0.88rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .sub { font-size: 0.75rem; }
    .badge { margin-top: 4px; }

    /* registered channel grid */
    .channels-panel {
      background: color-mix(in srgb, var(--accent) 16%, var(--bg-elev));
      border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--border));
      border-radius: var(--radius);
      padding: 14px;
      margin: 0 0 16px;
    }
    .channels-panel h2 {
      margin: 0;
      font-size: 1.05rem;
    }
    .channels-lede {
      margin: 4px 0 12px;
      color: var(--text-sub);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .channel-grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .channel-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px 8px;
    }
    .channel-card.is-active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .channel-pick {
      display: grid;
      gap: 2px;
      width: 100%;
      min-height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .channel-pick:focus-visible,
    .channel-yt:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .channel-pick:active { opacity: 0.75; }
    .channel-name {
      font-weight: 700;
      font-size: 0.82rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .channel-count {
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .channel-yt {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      padding: 2px 0;
    }
    .channel-yt:active { opacity: 0.75; }

    /* rankings */
    .rank-panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 0 10px;
      margin: 0 0 16px;
    }
    .rank-panel h2 {
      margin: 0 14px 8px;
      font-size: 1.05rem;
    }
    .rank-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin: 0;
      padding: 0 14px 8px;
    }
    .rank-tabs::-webkit-scrollbar { display: none; }
    .rank-tabs button {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .rank-tabs button[aria-selected="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    .rank-tabs button:active { opacity: 0.8; }
    .rank-desc {
      margin: 0 14px 10px;
      color: var(--text-sub);
      font-size: 0.75rem;
      line-height: 1.45;
    }
    .rank-scroller {
      list-style: none;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      margin: 0;
      padding: 0 14px 6px;
    }
    .rank-card {
      flex: 0 0 148px;
      scroll-snap-align: start;
      min-width: 0;
    }
    .rank-card a {
      display: block;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .rank-card a:active { opacity: 0.75; }
    .rank-thumb-wrap {
      position: relative;
    }
    .rank-card .thumb,
    .rank-card .thumb-fallback {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
    }
    .rank-no {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.72rem;
      background: rgba(20, 20, 18, 0.72);
      color: #fff;
      line-height: 1;
    }
    .rank-card.is-gold .rank-no { background: var(--gold); color: var(--gold-text); }
    .rank-card.is-silver .rank-no { background: var(--silver); color: var(--silver-text); }
    .rank-card.is-bronze .rank-no { background: var(--bronze); color: var(--bronze-text); }
    .rank-card .rank-title {
      font-weight: 700;
      font-size: 0.78rem;
      line-height: 1.35;
      margin: 6px 0 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .rank-card .rank-sub {
      color: var(--text-sub);
      font-size: 0.7rem;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>映画まとめ動画検索</h1>
      <p class="lede">登録している9チャンネルのまとめ動画を、タイトルの一部で検索できます。再生回数やいいね、新着などのランキングも見られます。上の一覧からチャンネルを選べます。</p>
      <div class="metrics" aria-label="登録数">
        <div class="metric"><b id="stat-total">—</b><span>登録動画</span></div>
        <div class="metric"><b id="stat-shorts">—</b><span>ショート</span></div>
        <div class="metric"><b id="stat-channels">9</b><span>チャンネル</span></div>
      </div>
    </header>

    <section class="channels-panel" aria-labelledby="channel-list-heading">
      <h2 id="channel-list-heading">登録チャンネル一覧</h2>
      <p class="channels-lede">名前を押すと、そのチャンネルの動画だけ表示します。もう一度押すと、すべてのチャンネルに戻ります。</p>
      <ul class="channel-grid" id="channel-grid"></ul>
    </section>

    <section class="filters" aria-label="検索条件">
      <label class="field">タイトル
        <input type="search" id="q" placeholder="作品名の一部（例：ゴジラ、トップガン）" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="filters-row">
        <label class="field">チャンネル
          <select id="channel">
            <option value="all">すべてのチャンネル</option>
          </select>
        </label>
        <label class="field">並び順
          <select id="sort">
            <option value="views">再生数</option>
            <option value="likes">いいね数</option>
            <option value="newest">新着</option>
            <option value="likeRate">いいね率</option>
          </select>
        </label>
      </div>
      <label class="toggle">
        ショートのみ
        <input type="checkbox" id="shorts-only">
        <span class="switch" aria-hidden="true"></span>
      </label>
    </section>

    <section class="rank-panel" aria-labelledby="rank-heading">
      <h2 id="rank-heading">ランキング</h2>
      <div class="rank-tabs" id="rank-tabs" role="tablist" aria-label="ランキングの種類">
        <button type="button" role="tab" id="tab-views" aria-selected="true" data-rank="views">総合再生数</button>
        <button type="button" role="tab" id="tab-likes" aria-selected="false" data-rank="likes">いいね数</button>
        <button type="button" role="tab" id="tab-likeRate" aria-selected="false" data-rank="likeRate">隠れた名作</button>
        <button type="button" role="tab" id="tab-newest" aria-selected="false" data-rank="newest">新着</button>
        <button type="button" role="tab" id="tab-rising" aria-selected="false" data-rank="rising">急上昇</button>
        <button type="button" role="tab" id="tab-shorts" aria-selected="false" data-rank="shorts">ショート</button>
      </div>
      <p class="rank-desc" id="rank-desc"></p>
      <ol class="rank-scroller" id="rank-list"></ol>
    </section>

    <div class="status-row">
      <h2>検索結果</h2>
      <p class="count" id="result-count"></p>
    </div>
    <div id="status" class="msg" role="status">データを読み込んでいます…</div>
    <ul class="list" id="results"></ul>
    <button type="button" class="more" id="more" hidden>もっと見る</button>

    <footer id="footnote"></footer>
  </div>

  <script>
    (function () {
      "use strict";

      var PAGE_SIZE = 50;
      var RANK_SIZE = 12;
      var LIKE_RATE_MIN_VIEWS_GRID = 10000;
      var LIKE_RATE_MIN_VIEWS_RANK = 100000;
      var RISING_DAYS = 60;
      var channels = [];
      var videos = [];
      var limit = PAGE_SIZE;
      var rankCache = null;
      var currentRank = "views";

      var elQ = document.getElementById("q");
      var elCh = document.getElementById("channel");
      var elSort = document.getElementById("sort");
      var elShorts = document.getElementById("shorts-only");
      var elStatus = document.getElementById("status");
      var elResults = document.getElementById("results");
      var elMore = document.getElementById("more");
      var elCount = document.getElementById("result-count");
      var elGrid = document.getElementById("channel-grid");
      var elRankTabs = document.getElementById("rank-tabs");
      var elRankList = document.getElementById("rank-list");
      var elRankDesc = document.getElementById("rank-desc");
      var channelUrls = [];

      var RANK_META = {
        views: "再生回数が多かった動画のトップ12です。横にスライドして見られます。",
        likes: "いいねの数が多かった動画のトップ12です。",
        likeRate: "再生10万回以上で、いいね率（いいね÷再生）が高い日本語タイトルの動画です。",
        newest: "公開日が新しい動画のトップ12です。",
        rising: "過去60日に公開され、1日あたりの再生回数が多い動画です。",
        shorts: "ショート動画のうち、再生回数が多かったトップ12です。"
      };

      function normalize(s) {
        var t = (s || "").normalize("NFKC").toLowerCase();
        var out = "";
        for (var i = 0; i < t.length; i++) {
          var c = t.codePointAt(i);
          if (c >= 0x30a1 && c <= 0x30f6) {
            out += String.fromCodePoint(c - 0x60);
          } else {
            out += String.fromCodePoint(c);
          }
          if (c > 0xffff) i++;
        }
        return out.replace(/\s+/g, " ").trim();
      }

      function formatCount(n) {
        return n.toLocaleString("ja-JP");
      }

      function formatCompact(n) {
        if (n >= 100000000) {
          var oku = n / 100000000;
          var os = oku >= 10 ? oku.toFixed(0) : oku.toFixed(1).replace(/\.0$/, "");
          return os + "億";
        }
        if (n >= 10000) {
          var man = n / 10000;
          var ms = man >= 10 ? man.toFixed(0) : man.toFixed(1).replace(/\.0$/, "");
          return ms + "万";
        }
        return n.toLocaleString("ja-JP");
      }

      function formatViews(n) {
        return formatCompact(n) + "回";
      }

      function hasJP(title) {
        return /[\u3040-\u30ff\u3400-\u9fff]/.test(title || "");
      }

      function daysOld(ymd) {
        if (!ymd || typeof ymd !== "string") return null;
        var p = ymd.split("-");
        if (p.length !== 3) return null;
        var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        if (isNaN(d.getTime())) return null;
        var now = new Date();
        var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        return Math.round((today - d) / 86400000);
      }

      function formatWhen(ymd) {
        var days = daysOld(ymd);
        if (days === null) return "";
        if (days <= 0) return "今日";
        if (days === 1) return "昨日";
        if (days < 7) return days + "日前";
        if (days < 30) return Math.floor(days / 7) + "週間前";
        if (days < 365) return Math.floor(days / 30) + "ヶ月前";
        var p = ymd.split("-");
        return Number(p[0]) + "年" + Number(p[1]) + "月" + Number(p[2]) + "日";
      }

      function likeRate(v, minViews) {
        if (v.views < minViews || v.likes < 0 || v.views <= 0) return -1;
        return v.likes / v.views;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function syncChannelCards() {
        if (!elGrid) return;
        var cards = elGrid.querySelectorAll(".channel-card");
        for (var i = 0; i < cards.length; i++) {
          var on = cards[i].getAttribute("data-ch") === elCh.value;
          if (on) cards[i].classList.add("is-active");
          else cards[i].classList.remove("is-active");
          var btn = cards[i].querySelector(".channel-pick");
          if (btn) btn.setAttribute("aria-pressed", on ? "true" : "false");
        }
      }

      function renderChannelGrid() {
        if (!elGrid) return;
        var counts = [];
        for (var i = 0; i < channels.length; i++) counts[i] = 0;
        for (var v = 0; v < videos.length; v++) {
          var idx = videos[v].ch;
          if (idx >= 0 && idx < counts.length) counts[idx]++;
        }
        var html = "";
        for (var c = 0; c < channels.length; c++) {
          var name = channels[c] || "";
          var url = channelUrls[c] || "";
          html +=
            '<li class="channel-card" data-ch="' +
            c +
            '"><button type="button" class="channel-pick" data-ch="' +
            c +
            '" aria-pressed="false"><span class="channel-name">' +
            escapeHtml(name) +
            '</span><span class="channel-count">' +
            formatCount(counts[c] || 0) +
            "本</span></button>";
          if (url) {
            html +=
              '<a class="channel-yt" href="' +
              escapeHtml(url) +
              '" target="_blank" rel="noopener noreferrer">YouTubeで見る</a>';
          }
          html += "</li>";
        }
        elGrid.innerHTML = html;
        elGrid.addEventListener("click", function (ev) {
          var btn = ev.target.closest(".channel-pick");
          if (!btn || !elGrid.contains(btn)) return;
          var ch = btn.getAttribute("data-ch");
          if (elCh.value === ch) {
            elCh.value = "all";
          } else {
            elCh.value = ch;
          }
          resetAndRender();
          var row = document.querySelector(".status-row");
          if (row && row.scrollIntoView) {
            row.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
        syncChannelCards();
      }

      function sortVideos(arr) {
        var mode = elSort.value;
        var copy = arr.slice();
        copy.sort(function (a, b) {
          if (mode === "likes") {
            var al = a.likes < 0 ? -1 : a.likes;
            var bl = b.likes < 0 ? -1 : b.likes;
            if (bl !== al) return bl - al;
            return (b.views < 0 ? -1 : b.views) - (a.views < 0 ? -1 : a.views);
          }
          if (mode === "newest") {
            var ap = a.published || "";
            var bp = b.published || "";
            if (!ap && !bp) return (b.views < 0 ? -1 : b.views) - (a.views < 0 ? -1 : a.views);
            if (!ap) return 1;
            if (!bp) return -1;
            if (bp !== ap) return bp < ap ? -1 : 1;
            return (b.views < 0 ? -1 : b.views) - (a.views < 0 ? -1 : a.views);
          }
          if (mode === "likeRate") {
            var ar = likeRate(a, LIKE_RATE_MIN_VIEWS_GRID);
            var br = likeRate(b, LIKE_RATE_MIN_VIEWS_GRID);
            if (br !== ar) return br - ar;
            return (b.views < 0 ? -1 : b.views) - (a.views < 0 ? -1 : a.views);
          }
          var av = a.views < 0 ? -1 : a.views;
          var bv = b.views < 0 ? -1 : b.views;
          return bv - av;
        });
        return copy;
      }

      function currentFilters() {
        var tokens = normalize(elQ.value)
          .split(" ")
          .map(function (t) { return t.trim(); })
          .filter(Boolean);
        var ch = elCh.value;
        var shortsOnly = elShorts.checked;
        var out = [];
        for (var i = 0; i < videos.length; i++) {
          var v = videos[i];
          if (shortsOnly && !v.short) continue;
          if (ch !== "all" && String(v.ch) !== ch) continue;
          if (tokens.length) {
            var ok = true;
            for (var j = 0; j < tokens.length; j++) {
              if (v.norm.indexOf(tokens[j]) === -1) {
                ok = false;
                break;
              }
            }
            if (!ok) continue;
          }
          out.push(v);
        }
        return sortVideos(out);
      }

      function thumbHtml(v) {
        var src = "https://i.ytimg.com/vi/" + encodeURIComponent(v.id) + "/hqdefault.jpg";
        return (
          '<img class="thumb" src="' + src + '" alt="" loading="lazy" decoding="async">' +
          '<span class="thumb-fallback" hidden aria-hidden="true">' +
            '<svg viewBox="0 0 28 28" focusable="false">' +
              '<circle cx="14" cy="14" r="13" fill="currentColor" opacity="0.2"/>' +
              '<polygon points="11,8 21,14 11,20" fill="currentColor"/>' +
            "</svg>" +
          "</span>"
        );
      }

      function bindThumbErrors(root) {
        var imgs = root.querySelectorAll("img.thumb");
        for (var t = 0; t < imgs.length; t++) {
          imgs[t].addEventListener("error", function () {
            this.style.display = "none";
            if (this.nextElementSibling) this.nextElementSibling.removeAttribute("hidden");
          });
        }
      }

      function statsLine(v) {
        var parts = [];
        if (v.views >= 0) parts.push(formatViews(v.views));
        if (v.likes >= 0) parts.push("👍 " + formatCompact(v.likes));
        var when = formatWhen(v.published);
        if (when) parts.push(when);
        if (!parts.length) return "";
        var html = '<p class="stats-line">';
        for (var i = 0; i < parts.length; i++) {
          if (i) html += "<span aria-hidden=\"true\">·</span>";
          html += "<span>" + escapeHtml(parts[i]) + "</span>";
        }
        html += "</p>";
        return html;
      }

      function rankMetric(kind, v) {
        if (kind === "likes") {
          return v.likes >= 0 ? "👍 " + formatCompact(v.likes) : "";
        }
        if (kind === "likeRate") {
          var r = likeRate(v, LIKE_RATE_MIN_VIEWS_RANK);
          return r >= 0 ? "いいね率 " + (r * 100).toFixed(2) + "%" : "";
        }
        if (kind === "newest") {
          return formatWhen(v.published);
        }
        if (kind === "rising") {
          var d = daysOld(v.published);
          if (d === null || v.views < 0) return "";
          return formatCompact(Math.round(v.views / Math.max(d, 1))) + "回/日";
        }
        return v.views >= 0 ? formatViews(v.views) : "";
      }

      function byViewsDesc(a, b) {
        return (b.views < 0 ? -1 : b.views) - (a.views < 0 ? -1 : a.views);
      }

      function buildRankings() {
        var views = videos.filter(function (v) { return v.views >= 0; }).slice().sort(byViewsDesc).slice(0, RANK_SIZE);
        var likes = videos.filter(function (v) { return v.likes >= 0; }).slice().sort(function (a, b) {
          if (b.likes !== a.likes) return b.likes - a.likes;
          return byViewsDesc(a, b);
        }).slice(0, RANK_SIZE);
        var likeRateList = videos.filter(function (v) {
          return likeRate(v, LIKE_RATE_MIN_VIEWS_RANK) >= 0 && hasJP(v.title);
        }).slice().sort(function (a, b) {
          var dlt = likeRate(b, LIKE_RATE_MIN_VIEWS_RANK) - likeRate(a, LIKE_RATE_MIN_VIEWS_RANK);
          if (dlt) return dlt;
          return byViewsDesc(a, b);
        }).slice(0, RANK_SIZE);
        var newest = videos.filter(function (v) { return !!v.published; }).slice().sort(function (a, b) {
          if (b.published !== a.published) return b.published < a.published ? -1 : 1;
          return byViewsDesc(a, b);
        }).slice(0, RANK_SIZE);
        var rising = videos.filter(function (v) {
          var d = daysOld(v.published);
          return d !== null && d <= RISING_DAYS && v.views >= 0;
        }).slice().sort(function (a, b) {
          var sa = a.views / Math.max(daysOld(a.published), 1);
          var sb = b.views / Math.max(daysOld(b.published), 1);
          if (sb !== sa) return sb - sa;
          return byViewsDesc(a, b);
        }).slice(0, RANK_SIZE);
        var shorts = videos.filter(function (v) { return v.short && v.views >= 0; }).slice().sort(byViewsDesc).slice(0, RANK_SIZE);
        rankCache = {
          views: views,
          likes: likes,
          likeRate: likeRateList,
          newest: newest,
          rising: rising,
          shorts: shorts
        };
      }

      function renderRankings() {
        if (!rankCache || !elRankList) return;
        var kind = currentRank;
        var list = rankCache[kind] || [];
        elRankDesc.textContent = RANK_META[kind] || "";
        var tabs = elRankTabs.querySelectorAll("button[data-rank]");
        for (var t = 0; t < tabs.length; t++) {
          tabs[t].setAttribute("aria-selected", tabs[t].getAttribute("data-rank") === kind ? "true" : "false");
        }
        var html = "";
        for (var i = 0; i < list.length; i++) {
          var v = list[i];
          var href = "video.html?id=" + encodeURIComponent(v.id);
          var medal = i === 0 ? " is-gold" : i === 1 ? " is-silver" : i === 2 ? " is-bronze" : "";
          var chName = channels[v.ch] || "";
          var metric = rankMetric(kind, v);
          var sub = chName;
          if (metric) sub += (sub ? " · " : "") + metric;
          html +=
            '<li class="rank-card' + medal + '"><a href="' +
            escapeHtml(href) +
            '"><div class="rank-thumb-wrap">' +
            thumbHtml(v) +
            '<span class="rank-no" aria-label="' +
            (i + 1) +
            '位">' +
            (i + 1) +
            '</span></div><p class="rank-title">' +
            escapeHtml(v.title) +
            '</p><p class="rank-sub">' +
            escapeHtml(sub) +
            "</p></a></li>";
        }
        elRankList.innerHTML = html;
        elRankList.scrollLeft = 0;
        bindThumbErrors(elRankList);
      }

      function render() {
        if (!videos.length) return;
        var matched = currentFilters();
        var shown = matched.slice(0, limit);
        var remaining = matched.length - shown.length;

        elCount.textContent =
          formatCount(matched.length) + "件中 " + formatCount(shown.length) + "件を表示";

        if (matched.length === 0) {
          elStatus.hidden = false;
          elStatus.className = "msg";
          elStatus.textContent = "一致する動画はありません。言葉を短くするか、チャンネル指定を外してみてください。";
          elResults.innerHTML = "";
          elMore.hidden = true;
          return;
        }

        elStatus.hidden = true;
        var html = "";
        for (var i = 0; i < shown.length; i++) {
          var v = shown[i];
          var href = "video.html?id=" + encodeURIComponent(v.id);
          var chName = channels[v.ch] || "";
          html +=
            '<li class="item' + (v.short ? ' is-short' : '') + '"><a href="' +
            escapeHtml(href) +
            '">' +
            thumbHtml(v) +
            '<div class="meta"><p class="title">' +
            escapeHtml(v.title) +
            '</p><p class="sub">' +
            escapeHtml(chName) +
            "</p>" +
            statsLine(v) +
            (v.short ? '<span class="badge">ショート</span>' : "") +
            "</div></a></li>";
        }
        elResults.innerHTML = html;
        bindThumbErrors(elResults);

        if (remaining > 0) {
          elMore.hidden = false;
          var next = Math.min(PAGE_SIZE, remaining);
          elMore.textContent =
            "もっと見る（さらに" + formatCount(next) + "件 / 残り" + formatCount(remaining) + "件）";
        } else {
          elMore.hidden = true;
        }
      }

      function resetAndRender() {
        limit = PAGE_SIZE;
        render();
        syncChannelCards();
      }

      elQ.addEventListener("input", resetAndRender);
      elCh.addEventListener("change", resetAndRender);
      elSort.addEventListener("change", resetAndRender);
      elShorts.addEventListener("change", resetAndRender);
      elMore.addEventListener("click", function () {
        limit += PAGE_SIZE;
        render();
      });
      elRankTabs.addEventListener("click", function (ev) {
        var btn = ev.target.closest("button[data-rank]");
        if (!btn || !elRankTabs.contains(btn)) return;
        var kind = btn.getAttribute("data-rank");
        if (!kind || kind === currentRank) return;
        currentRank = kind;
        renderRankings();
      });

      function parseRow(r) {
        var isShort = r[3] === 1 || r[3] === true;
        var published = r[7];
        if (typeof published !== "string") published = "";
        return {
          id: r[0],
          title: r[1],
          ch: r[2],
          short: isShort,
          views: typeof r[4] === "number" ? r[4] : -1,
          likes: typeof r[5] === "number" ? r[5] : -1,
          comments: typeof r[6] === "number" ? r[6] : -1,
          published: published,
          duration: typeof r[8] === "number" ? r[8] : -1,
          norm: normalize(r[1])
        };
      }

      fetch("data.json")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          channels = data.channels || [];
          var rows = data.videos || [];
          videos = new Array(rows.length);
          var shortCount = 0;
          for (var i = 0; i < rows.length; i++) {
            videos[i] = parseRow(rows[i]);
            if (videos[i].short) shortCount++;
          }
          document.getElementById("stat-total").textContent = formatCount(videos.length);
          document.getElementById("stat-shorts").textContent = formatCount(shortCount);
          var elChStat = document.getElementById("stat-channels");
          if (elChStat) elChStat.textContent = formatCount(channels.length);

          channelUrls = data.channelUrls || [];
          if (!channelUrls.length && data.channelIds) {
            channelUrls = [];
            for (var u = 0; u < data.channelIds.length; u++) {
              channelUrls.push("https://www.youtube.com/channel/" + data.channelIds[u]);
            }
          }

          for (var c = 0; c < channels.length; c++) {
            var opt = document.createElement("option");
            opt.value = String(c);
            opt.textContent = channels[c];
            elCh.appendChild(opt);
          }
          renderChannelGrid();
          buildRankings();
          renderRankings();

          var note = document.getElementById("footnote");
          var when = data.generatedAtLabel || "";
          note.textContent =
            (when ? when + "時点の、" : "") +
            "YouTube公開アップロード一覧です。再生回数・いいね数・コメント数・公開日・再生時間はYouTube Data APIから取得しています。メンバー限定や削除済みなど、一部の動画では取得できない項目があります。映画カルチュア FilmIsNow Japanは公開一覧の11,477本を収録しています（以前のチャンネル総数11,540本より63本少ない）。映画ドラマ二アックは公開アップロード15本に加え、メンバー限定など4本を含む19本です。ほかのチャンネルは総数と一致しています。";

          render();
        })
        .catch(function () {
          elStatus.hidden = false;
          elStatus.className = "msg error";
          elStatus.textContent = "データの読み込みに失敗しました。ページを開き直すか、通信環境を確認してください。";
        });
    })();
  </script>
</body>
</html>
